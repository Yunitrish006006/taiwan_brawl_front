name: Speed camera Flutter package

on:
  push:
    branches:
      - feature/modular-speed-camera-20261119
    paths:
      - 'packages/taiwan_speed_camera/**'
      - '.github/workflows/speed-camera-flutter.yml'
      - 'pubspec.yaml'
      - 'lib/main.dart'
      - 'lib/pages/home/home_page_layout.dart'
      - 'lib/pages/general/auth_page.dart'
      - 'android/app/src/main/AndroidManifest.xml'
      - 'ios/Runner/Info.plist'
  pull_request:
    paths:
      - 'packages/taiwan_speed_camera/**'
      - '.github/workflows/speed-camera-flutter.yml'
      - 'pubspec.yaml'
      - 'lib/main.dart'
      - 'lib/pages/home/home_page_layout.dart'
      - 'lib/pages/general/auth_page.dart'
      - 'android/app/src/main/AndroidManifest.xml'
      - 'ios/Runner/Info.plist'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/taiwan_speed_camera
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze standalone package
        run: flutter analyze
      - name: Run standalone package unit tests
        run: flutter test

  app-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: taiwan_brawl_front
      - uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/user_ui_settings
          path: user_ui_settings
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve main app dependencies
        working-directory: taiwan_brawl_front
        run: flutter pub get
      - name: Run main app regression tests
        working-directory: taiwan_brawl_front
        run: flutter test
      - name: Build Web with optional road-safety route
        working-directory: taiwan_brawl_front
        run: flutter build web --release

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: taiwan_brawl_front
      - uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/user_ui_settings
          path: user_ui_settings
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve app dependencies
        working-directory: taiwan_brawl_front
        run: flutter pub get
      - name: Build Android debug APK
        working-directory: taiwan_brawl_front
        run: flutter build apk --debug

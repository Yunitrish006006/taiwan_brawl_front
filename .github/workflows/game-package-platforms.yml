name: Game package platform checks

on:
  pull_request:
    paths:
      - '.github/workflows/game-package-platforms.yml'
      - 'packages/games/**'
      - 'packages/shared/**'
      - 'lib/game_modules/**'
      - 'lib/services/game_library_*.dart'
      - 'lib/services/game_resource_*.dart'
      - 'test/game_library_*.dart'
      - 'test/street_scrap_game_module_test.dart'
      - 'test/street_scrap_progress_store_test.dart'
      - 'test/game_player_data_isolation_test.dart'
      - 'test/game_resource_*.dart'
      - 'test/p2p_webrtc_runtime_test.dart'
      - 'test/chat_service_factory_test.dart'
      - 'test/chat_service_offline_test.dart'
      - 'test/secure_device_identity_test.dart'
      - 'test/peer_trust_service_test.dart'
      - 'test/peer_trust_dialog_test.dart'
      - 'integration_test/**'
      - 'lib/**'
      - 'android/**'
      - 'ios/**'
      - 'macos/**'
      - 'windows/**'
      - 'linux/**'
      - 'web/**'
      - 'tool/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
  push:
    paths:
      - '.github/workflows/game-package-platforms.yml'
      - 'packages/games/**'
      - 'packages/shared/**'
      - 'lib/game_modules/**'
      - 'lib/services/game_library_*.dart'
      - 'lib/services/game_resource_*.dart'
      - 'test/game_library_*.dart'
      - 'test/street_scrap_game_module_test.dart'
      - 'test/street_scrap_progress_store_test.dart'
      - 'test/game_player_data_isolation_test.dart'
      - 'test/game_resource_*.dart'
      - 'test/p2p_webrtc_runtime_test.dart'
      - 'test/chat_service_factory_test.dart'
      - 'test/chat_service_offline_test.dart'
      - 'test/secure_device_identity_test.dart'
      - 'test/peer_trust_service_test.dart'
      - 'test/peer_trust_dialog_test.dart'
      - 'integration_test/**'
      - 'lib/**'
      - 'android/**'
      - 'ios/**'
      - 'macos/**'
      - 'windows/**'
      - 'linux/**'
      - 'web/**'
      - 'tool/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-tests:
    name: Game packages (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          path: taiwan_brawl_front

      - name: Checkout shared UI package
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/user_ui_settings
          ref: 96e4f1d54f27a4c0fc1c923e1c8c2da9a384d117
          path: user_ui_settings

      - name: Verify Street Scrap Web writer lock bridge
        working-directory: taiwan_brawl_front
        run: >-
          node --test
          tool/street_scrap_writer_lock.test.mjs
          tool/street_scrap_art_resource.test.mjs
          tool/ios_deployment_target.test.mjs

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true
      - name: Test Archery package
        working-directory: taiwan_brawl_front/packages/games/archery
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Test Mini Royale package
        working-directory: taiwan_brawl_front/packages/games/mini_royale
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Test Street Scrap package
        working-directory: taiwan_brawl_front/packages/games/street_scrap
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Preserve failed golden comparisons
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: game-package-failures-${{ matrix.os }}
          path: taiwan_brawl_front/packages/games/*/test/failures/**
          if-no-files-found: ignore

  web-resource-storage:
    name: Web IndexedDB resource lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          path: taiwan_brawl_front

      - name: Checkout shared UI package
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/user_ui_settings
          ref: 96e4f1d54f27a4c0fc1c923e1c8c2da9a384d117
          path: user_ui_settings

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true
      - name: Resolve frontend dependencies
        working-directory: taiwan_brawl_front
        run: flutter pub get

      - name: Verify browser IndexedDB resource persistence and install lifecycle
        working-directory: taiwan_brawl_front
        run: >-
          flutter test --platform chrome
          test/game_resource_web_storage_test.dart
          test/game_resource_installer_test.dart

  p2p-webrtc-runtime:
    name: P2P WebRTC signed manual signaling and message runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          path: taiwan_brawl_front

      - name: Checkout shared UI package
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/user_ui_settings
          ref: 96e4f1d54f27a4c0fc1c923e1c8c2da9a384d117
          path: user_ui_settings

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true
      - name: Resolve frontend dependencies
        working-directory: taiwan_brawl_front
        run: flutter pub get

      - name: Verify signed manual signaling and browser P2P delivery
        working-directory: taiwan_brawl_front
        run: >-
          flutter test --platform chrome
          test/p2p_webrtc_runtime_test.dart
          test/chat_service_factory_test.dart
          test/secure_device_identity_test.dart
          test/peer_trust_service_test.dart
          test/peer_trust_dialog_test.dart

  game-module-consumers:
    name: Game module App consumers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          path: taiwan_brawl_front

      - name: Checkout shared UI package
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/user_ui_settings
          ref: 96e4f1d54f27a4c0fc1c923e1c8c2da9a384d117
          path: user_ui_settings

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true
      - name: Resolve frontend dependencies
        working-directory: taiwan_brawl_front
        run: flutter pub get

      - name: Analyze frontend and game host integration
        working-directory: taiwan_brawl_front
        run: flutter analyze

      - name: Verify game library, routes and parallel data ownership
        working-directory: taiwan_brawl_front
        run: >-
          flutter test
          test/game_library_controller_test.dart
          test/game_module_routes_test.dart
          test/street_scrap_game_module_test.dart
          test/street_scrap_progress_store_test.dart
          test/game_player_data_isolation_test.dart

  shared-package-tests:
    name: Shared Dart packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          path: taiwan_brawl_front

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Test taiwan_brawl_core
        working-directory: taiwan_brawl_front/packages/shared/taiwan_brawl_core
        run: |
          dart pub get
          dart analyze
          dart test

      - name: Test taiwan_brawl_messaging
        working-directory: taiwan_brawl_front/packages/shared/taiwan_brawl_messaging
        run: |
          dart pub get
          dart analyze
          dart test

  native-resource-lifecycle:
    name: Native game data and resource lifecycle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          path: taiwan_brawl_front

      - name: Checkout shared UI package
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/user_ui_settings
          ref: 96e4f1d54f27a4c0fc1c923e1c8c2da9a384d117
          path: user_ui_settings

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true
      - name: Resolve frontend dependencies
        working-directory: taiwan_brawl_front
        run: flutter pub get

      - name: Verify native game data isolation and resource lifecycle
        working-directory: taiwan_brawl_front
        run: >-
          flutter test
          test/game_library_store_test.dart
          test/game_resource_installer_test.dart
          test/game_player_data_isolation_test.dart
          test/game_resource_catalog_source_test.dart

  platform-resource-integration:
    name: Game resource lifecycle (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Android emulator
            os: ubuntu-latest
          - platform: iOS simulator
            os: macos-latest
          - platform: macOS desktop
            os: macos-latest
          - platform: Windows desktop
            os: windows-latest
          - platform: Linux desktop
            os: ubuntu-latest
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          path: taiwan_brawl_front

      - name: Checkout shared UI package
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/user_ui_settings
          ref: 96e4f1d54f27a4c0fc1c923e1c8c2da9a384d117
          path: user_ui_settings

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true
      - name: Set up Java 17
        if: matrix.platform == 'Android emulator'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolve frontend dependencies
        working-directory: taiwan_brawl_front
        run: flutter pub get

      - name: Install Linux desktop integration dependencies
        if: matrix.platform == 'Linux desktop'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev xvfb dbus-x11 libgl1-mesa-dri strace

      - name: Enable Android emulator hardware acceleration
        if: matrix.platform == 'Android emulator'
        run: |
          # Hosted Linux exposes KVM, but the runner user needs device access.
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Run on Android emulator
        if: matrix.platform == 'Android emulator'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-linux-hw-accel: false
          working-directory: taiwan_brawl_front
          script: flutter test integration_test/game_resource_native_lifecycle_test.dart -d emulator-5554

      - name: Run on iOS Simulator
        if: matrix.platform == 'iOS simulator'
        working-directory: taiwan_brawl_front
        shell: bash
        run: |
          device_line="$(xcrun simctl list devices available -j | ruby -rjson -e 'JSON.parse(STDIN.read)["devices"].values.flatten.find { |d| d["name"].start_with?("iPhone") }&.then { |d| puts "#{d["udid"]} #{d["state"]}" }')"
          read -r device_id device_state <<< "$device_line"
          if [[ -z "$device_id" ]]; then
            echo "No available iOS Simulator device was found" >&2
            xcrun simctl list devices available
            exit 1
          fi
          if [[ "$device_state" != "Booted" ]]; then
            xcrun simctl boot "$device_id"
          fi
          xcrun simctl bootstatus "$device_id" -b
          flutter test integration_test/game_resource_native_lifecycle_test.dart -d "$device_id"

      - name: Configure unsigned macOS test build
        if: matrix.platform == 'macOS desktop'
        working-directory: taiwan_brawl_front
        shell: bash
        run: |
          python3 - <<'PYMAC'
          from pathlib import Path
          path = Path('macos/Runner.xcodeproj/project.pbxproj')
          text = path.read_text()
          marker = 'CODE_SIGN_STYLE = Automatic;'
          if marker not in text:
              raise SystemExit('Expected macOS signing settings not found')
          # Ephemeral CI checkout only; no development profile or account needed.
          text = text.replace(marker, 'CODE_SIGN_STYLE = Manual; CODE_SIGNING_ALLOWED = NO; CODE_SIGNING_REQUIRED = NO;')
          path.write_text(text)
          PYMAC

      - name: Run on macOS desktop
        if: matrix.platform == 'macOS desktop'
        working-directory: taiwan_brawl_front
        run: flutter test integration_test/game_resource_native_lifecycle_test.dart -d macos

      - name: Run on Windows desktop
        if: matrix.platform == 'Windows desktop'
        working-directory: taiwan_brawl_front
        run: flutter test integration_test/game_resource_native_lifecycle_test.dart -d windows

      - name: Run on Linux desktop
        if: matrix.platform == 'Linux desktop'
        timeout-minutes: 10
        working-directory: taiwan_brawl_front
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GDK_BACKEND: x11
        run: |
          set -o pipefail
          dbus-run-session -- xvfb-run -a strace -f -e trace=process,signal -o linux-process.log flutter test integration_test/game_resource_native_lifecycle_test.dart -d linux -v 2>&1 | tee linux-lifecycle.log

      - name: Preserve Linux lifecycle diagnostics
        if: failure() && matrix.platform == 'Linux desktop'
        uses: actions/upload-artifact@v4
        with:
          name: linux-lifecycle-diagnostics
          path: |
            taiwan_brawl_front/linux-lifecycle.log
            taiwan_brawl_front/linux-process.log
          if-no-files-found: ignore

  application-builds:
    name: App build (${{ matrix.target }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: web
          - os: ubuntu-latest
            target: android
            setup_java: true
          - os: macos-latest
            target: ios
            no_codesign: true
          - os: macos-latest
            target: macos
            no_codesign: true
          - os: windows-latest
            target: windows
          - os: ubuntu-latest
            target: linux
            install_linux_deps: true
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          path: taiwan_brawl_front

      - name: Checkout shared UI package
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/user_ui_settings
          ref: 96e4f1d54f27a4c0fc1c923e1c8c2da9a384d117
          path: user_ui_settings

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true
      - name: Set up Java 17 for Android
        if: matrix.setup_java == true
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Linux desktop build dependencies
        if: matrix.install_linux_deps == true
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Resolve frontend dependencies
        working-directory: taiwan_brawl_front
        run: flutter pub get

      - name: Build complete App for target platform
        working-directory: taiwan_brawl_front
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
          NO_CODESIGN: ${{ matrix.no_codesign }}
        run: |
          if [[ "$BUILD_TARGET" == "ios" && "$NO_CODESIGN" == "true" ]]; then
            flutter build ios --no-codesign
          elif [[ "$BUILD_TARGET" == "macos" && "$NO_CODESIGN" == "true" ]]; then
            flutter build macos --config-only
            xcodebuild \
              -workspace macos/Runner.xcworkspace \
              -scheme Runner \
              -configuration Debug \
              -destination 'platform=macOS' \
              -derivedDataPath build/macos/Build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY='' \
              build
          elif [[ "$BUILD_TARGET" == "android" ]]; then
            flutter build apk --debug
          elif [[ "$BUILD_TARGET" == "web" ]]; then
            bash tool/build_web.sh
          else
            flutter build "$BUILD_TARGET" --debug
          fi
